[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skywright"
version = "0.1.0"
description = "Opinionated deployment for PyTorch training and fine-tuning jobs"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Zorro909" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.13,<2.14",
]

[project.scripts]
skywright = "skywright.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "ty>=0.0.1a20,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skywright"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.14"

[tool.uv.pip]
torch-backend = "auto"
